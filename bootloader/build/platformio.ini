; Builds bootloader_xmc_a.bin: the stock ESP-IDF 5.5.5 bootloader for the
; classic ESP32, with XMC A-series flash added to its XMC whitelist.
; Run prepare_bootloader_support.py first (see ../README.md).
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = espidf
