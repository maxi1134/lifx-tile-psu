; PlatformIO project for the basic build. Open this folder (arduino/) in
; PlatformIO; the sketch itself stays Arduino IDE-compatible in lifx_tile_id/.

[platformio]
src_dir = lifx_tile_id

[env:esp32dev]
; arduino-esp32 3.3.12 on ESP-IDF 5.5.5, pinned so the bootloader below
; matches the core it was built against.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

; Stock bootloader + XMC A-series flash added to its whitelist. Boards whose
; `esptool flash-id` says "Manufacturer: 20, Device: 7017" to "7020" boot-loop
; with "XMC flash startup fail" on the stock one. Harmless on every other board.
; See ../bootloader/README.md. Run `-t clean` after swapping this file.
board_build.arduino.custom_bootloader = ${PROJECT_DIR}/../bootloader/bootloader_xmc_a.bin
